name: Build

# Every push and pull request builds the watch firmware and the companion
# app and keeps them as workflow artifacts. Pushing a tag such as v0.4.0
# also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # creating the release

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            code/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('code/platformio.ini', 'code/bootloader/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build the watch firmware
        working-directory: code
        run: pio run -e watch -e watch_direct

      - name: Build the bootloader
        working-directory: code/bootloader
        run: pio run -e watch_dfu_bootloader

      - name: Collect
        run: |
          mkdir -p out
          # Installed over Bluetooth (companion app) or USB
          # (tools/usb_dfu_update.py); needs the bootloader below.
          cp code/.pio/build/watch/firmware.bin out/epaper-watch-firmware.bin
          # Recovery image linked at 0x08000000, without the bootloader.
          cp code/.pio/build/watch_direct/firmware.bin out/epaper-watch-firmware-direct.bin
          # The staged-update bootloader at 0x08000000 (flashed once, ROM DFU).
          cp code/bootloader/.pio/build/watch_dfu_bootloader/firmware.bin out/epaper-watch-bootloader.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.bin

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the companion app
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Collect
        run: |
          mkdir -p out
          cp companion/app/build/outputs/apk/debug/app-debug.apk out/epaper-watch-companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
