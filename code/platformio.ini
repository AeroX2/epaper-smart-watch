; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Keep the proven direct-boot image as the default recovery target. The
; resident ST USB DFU image is built independently in code/bootloader.
default_envs = watch_direct

[env:watch]
platform = ststm32
board = epaper_smart_watch
framework = arduino
upload_protocol = dfu
board_build.flash_offset = 0x10000
board_upload.offset_address = 0x08010000
board_upload.maximum_size = 761856
monitor_speed = 115200
lib_deps =
    stm32duino/STM32duino RTC @ 1.9.0
    stm32duino/STM32duino Low Power @ 1.5.0
    stm32duino/STM32duinoBLE @ 1.4.2
    sparkfun/SparkFun BMA400 Arduino Library @ 1.0.0
    adafruit/Adafruit BME280 Library @ 2.3.0
    adafruit/Adafruit MAX1704X @ 1.0.3
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D WATCH_HAS_RESIDENT_DFU
    -D USB_MANUFACTURER="OpenEPaperLink"
    -D USB_PRODUCT="E-paper Smart Watch Bring-up"

[env:watch_stlink]
extends = env:watch
upload_protocol = stlink

; Direct-boot recovery image. This bypasses the resident OTA installer and is
; the known-safe target for restoring USB serial while loader work is tested.
[env:watch_direct]
extends = env:watch
build_unflags =
    -D WATCH_HAS_RESIDENT_DFU
board_build.flash_offset = 0x0
board_upload.offset_address = 0x08000000
board_upload.maximum_size = 827392

[env:watch_direct_stlink]
extends = env:watch_direct
upload_protocol = stlink
