<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAD close-up</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9ebef; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #note { position: fixed; left: 8px; top: 8px; background: #fffc; padding: 4px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div id="note">Close-up of cad-body.json (body grey, lid blue, flap orange). ?cam=x,y,z&amp;tgt=x,y,z&amp;hide=body|lid|flap, in case X, Y, Z (mm).</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  function vec(name, d) {                       // case X, Y, Z  ->  scene x, y(up), z
    var a = (q.get(name) || d).split(",").map(Number);
    return new THREE.Vector3(a[0], a[2], a[1]);
  }
  var hide = (q.get("hide") || "").split("|");
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9ebef);
  var camera = new THREE.PerspectiveCamera(25, 1, 0.5, 2000);
  camera.position.copy(vec("cam", "60,40,-60"));
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(vec("tgt", "20,11,-10"));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.75));
  var key = new THREE.DirectionalLight(0xffffff, 0.7);
  scene.add(key);
  function part(d, color, name) {
    if (!d || hide.indexOf(name) >= 0) return;
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(d.p), 3));
    g.setIndex(d.i);
    var flat = g.toNonIndexed();
    flat.computeVertexNormals();
    scene.add(new THREE.Mesh(flat, new THREE.MeshStandardMaterial({ color: color, roughness: 0.75, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(flat, 18), new THREE.LineBasicMaterial({ color: 0x1b1d22 })));
  }
  function draw() {
    key.position.copy(camera.position);
    renderer.render(scene, camera);
  }
  function size() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    draw();
  }
  controls.addEventListener("change", draw);
  addEventListener("resize", size);
  fetch("cad-body.json").then(function (r) { return r.json(); }).then(function (data) {
    part(data, 0xb9bdc6, "body");
    part(data.lid, 0x8fb2e0, "lid");
    part(data.flap, 0xe0843a, "flap");
    controls.update();
    size();
    document.title = "CAD close-up ready";
  });
})();
</script>
</body>
</html>
